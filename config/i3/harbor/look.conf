# ╭──────────────────────────────────────────────────────────────────────────────╮
# │  Harbor — how i3 looks. Template: {{token}} is filled from tokens.toml by     │
# │  `scripts/harbor apply`, which writes generated.conf (included by ../config)  │
# │  and reloads i3. Behaviour and keys stay in ../config.                        │
# ╰──────────────────────────────────────────────────────────────────────────────╯

font pango:{{ui}} Medium {{size_title}}px

# Focus is the accent and nothing else; everything idle recedes.
#                       border            bg                text              indicator         child_border
client.focused          {{accent}}        {{accent}}        {{on_accent}}     {{accent}}        {{accent}}
client.focused_inactive {{raised}}        {{raised}}        {{text}}          {{border_idle}}   {{border_idle}}
client.unfocused        {{canvas}}        {{canvas}}        {{text_muted}}    {{border_idle}}   {{border_idle}}
client.urgent           {{danger}}        {{danger}}        {{on_accent}}     {{danger}}        {{danger}}
client.placeholder      {{canvas}}        {{canvas}}        {{text_muted}}    {{canvas}}        {{canvas}}
client.background       {{canvas}}

# Corners, shadows, blur and motion come from picom (~/.config/picom/picom.conf).
default_border          pixel {{border}}
default_floating_border pixel {{border}}
gaps inner {{gap_inner}}
gaps outer {{gap_outer}}

# The background is the wallpaper's sky mixed into the base colour ("vibrancy"), so it reads as
# frosted glass without needing a compositor — it looks the same over xrdp.
bar {
        position            top
        font                pango:{{ui}} Medium {{size_bar}}px
        status_command      ~/.config/i3/scripts/bar.py
        tray_output         primary
        tray_padding        3
        padding             0px 4px
        separator_symbol    " "
        workspace_min_width 30

        colors {
                background  {{bar}}
                statusline  {{text}}
                separator   {{bar}}
                #                   border            bg                text
                focused_workspace   {{bar_pill}}      {{bar_pill}}      {{text}}
                active_workspace    {{bar_pill_dim}}  {{bar_pill_dim}}  {{text_muted}}
                inactive_workspace  {{bar}}           {{bar}}           {{text_muted}}
                urgent_workspace    {{danger}}        {{danger}}        {{on_accent}}
                binding_mode        {{accent}}        {{accent}}        {{on_accent}}
        }
}
