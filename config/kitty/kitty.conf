# ╭──────────────────────────────────────────────────────────────────────────╮
# │  kitty — Harbor                                                           │
# │  Colours come from harbor.conf, generated from ~/.config/i3/harbor/tokens │
# │  .toml; harbor sends SIGUSR1 at the Day/Night switch so every open window │
# │  reloads. Stays dark in both (TUIs keep their colours): dusk blue by day, │
# │  harbor night at night, cursor in the accent.                             │
# ╰──────────────────────────────────────────────────────────────────────────╯
include harbor.conf

# ── type ──
font_family        JetBrains Mono
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.0
modify_font        cell_height 112%
disable_ligatures  cursor

# ── surface: frosted by picom's blur ──
background_opacity          0.94
dynamic_background_opacity  yes
window_padding_width        6 10
placement_strategy          top-left
hide_window_decorations     yes
confirm_os_window_close     0

# ── cursor ──
cursor_shape                beam
cursor_beam_thickness       1.6
cursor_blink_interval       0.6
cursor_stop_blinking_after  10

# ── behaviour ──
scrollback_lines     20000
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes
url_style            curly
copy_on_select       no
strip_trailing_spaces smart

# ── tabs: rounded, quiet ──
tab_bar_edge             top
tab_bar_margin_width     6
tab_bar_margin_height    6 0
tab_bar_style            powerline
tab_powerline_style      round
tab_title_template       "{index}  {title}"
active_tab_font_style    normal
inactive_tab_font_style  normal
