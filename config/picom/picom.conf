# ╭──────────────────────────────────────────────────────────────────────────╮
# │  picom 12 — Harbor. Shape (corners, shadow, blur) and motion.             │
# │  GLX on NVIDIA; skipped automatically under xrdp (i3/scripts/autostart.sh) │
# │  Motion follows tokens.toml [motion]: one ease-out curve, 120–260 ms.     │
# ╰──────────────────────────────────────────────────────────────────────────╯
backend = "glx";
vsync = true;
use-damage = false;              # avoids flicker on the proprietary NVIDIA driver
unredir-if-possible = true;      # fullscreen games/video bypass the compositor
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-ewmh-active-win = true;
log-level = "warn";

# ── shape ─────────────────────────────────────────────────────────────────────
corner-radius = 12;

# Soft and low, like a sheet of paper lifted off the desk: large radius, small y-offset.
shadow = true;
shadow-radius = 26;
shadow-opacity = 0.30;
shadow-offset-x = -26;
shadow-offset-y = -18;

blur-method = "dual_kawase";
blur-strength = 7;
blur-background = false;         # turned on per window below (rofi, dunst)

fading = true;                   # opacity changes; open/close use the animations below
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

# ── per-window rules (later rules win) ────────────────────────────────────────
rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false; corner-radius = 0; },
  { match = "class_g = 'i3-frame'"; shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },               # GTK CSD draws its own
  { match = "window_type = 'tooltip'"; shadow = false; corner-radius = 6; },
  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'menu'";
    corner-radius = 8; },
  { match = "window_type = 'dnd'"; shadow = false; },
  { match = "fullscreen"; corner-radius = 0; },

  # kitty is 94 % opaque (Harbor terminal): frost what shows through
  { match = "class_g = 'kitty' && !fullscreen"; blur-background = true; },

  # Spotlight-style launcher: frosted, pops in slightly scaled
  { match = "class_g = 'Rofi'";
    blur-background = true; corner-radius = 16; full-shadow = true;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.16; start = 0; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.18; start = 0.97; end = 1; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "linear"; duration = 0.08; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity"; }
    ); },

  # Notification cards: frosted, slide in from the right edge
  { match = "class_g = 'Dunst'";
    blur-background = true; corner-radius = 14;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.22; start = 0; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.26; start = 36; end = 0; };
        shadow-offset-x = "offset-x"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.16; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        offset-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.16; start = 0; end = 24; };
        shadow-offset-x = "offset-x"; }
    ); },

  # Drop-down terminal ($mod+`): slides down from the top edge and back up
  { match = "class_g = 'dropdown-term'";
    animations = (
      { triggers = ["open", "show"];
        offset-y = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.24; start = "- window-height - window-y"; end = 0; };
        shadow-offset-y = "offset-y"; },
      { triggers = ["close", "hide"];
        offset-y = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.18; start = 0; end = "- window-height - window-y"; };
        shadow-offset-y = "offset-y"; }
    ); },

  # Things that must appear instantly and unadorned
  { match = "class_g = 'flameshot' || class_g = 'slop' || class_g = 'i3lock' || name = 'i3lock'";
    shadow = false; corner-radius = 0; fade = false; animations = (); },
);

# ── motion (everything not covered by a rule above) ───────────────────────────
animations = (
  # new window: rises out of the desk — scale 96 % → 100 % with a fade
  { triggers = ["open"];
    opacity = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.18; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity"; shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.22; start = 0.96; end = 1; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
  # closing: a quick fade with a slight shrink
  { triggers = ["close"];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity"; shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0.97; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
  # workspace switches: a short cross-dissolve, no movement
  { triggers = ["show"];
    opacity = { curve = "cubic-bezier(0.2, 0.8, 0.2, 1)"; duration = 0.12; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity"; shadow-opacity = "opacity"; },
  { triggers = ["hide"];
    opacity = { curve = "linear"; duration = 0.08; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity"; shadow-opacity = "opacity"; },
  # tiling re-layout glides instead of jumping
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.14; }
);
